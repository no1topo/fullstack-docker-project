name: CD - Build & Deploy

on:
  push:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  TERRAFORM_VERSION: 1.6.6

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      backend-image-uri: ${{ steps.select-backend-tag.outputs.image }}
      frontend-image-uri: ${{ steps.select-frontend-tag.outputs.image }}
      ecr-backend-image-uri: ${{ steps.push-ecr.outputs.backend_ecr_image }}
      ecr-frontend-image-uri: ${{ steps.push-ecr.outputs.frontend_ecr_image }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Select primary backend image tag
        id: select-backend-tag
        run: |
          echo "First tag:" $(echo "${{ steps.meta-backend.outputs.tags }}" | head -n1)
          echo "image=$(echo "${{ steps.meta-backend.outputs.tags }}" | head -n1)" >> $GITHUB_OUTPUT

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Select primary frontend image tag
        id: select-frontend-tag
        run: |
          echo "First tag:" $(echo "${{ steps.meta-frontend.outputs.tags }}" | head -n1)
          echo "image=$(echo "${{ steps.meta-frontend.outputs.tags }}" | head -n1)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials (for ECR)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Publish images to AWS ECR
        id: push-ecr
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          # Derive project name from tfvars
          ENV_NAME=$([[ "${{ github.ref }}" == 'refs/heads/main' ]] && echo prod || echo dev)
          PROJECT_NAME=$(sed -n "s/^\s*project_name\s*=\s*\"\(.*\)\".*/\1/p" terraform/environments/$ENV_NAME/terraform.tfvars | head -1)
          if [ -z "$PROJECT_NAME" ]; then PROJECT_NAME=fullstack-docker; fi
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URI="$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com"
          # Ensure repositories exist
          aws ecr describe-repositories --repository-names "$PROJECT_NAME-backend" >/dev/null 2>&1 || aws ecr create-repository --repository-name "$PROJECT_NAME-backend" >/dev/null
          aws ecr describe-repositories --repository-names "$PROJECT_NAME-frontend" >/dev/null 2>&1 || aws ecr create-repository --repository-name "$PROJECT_NAME-frontend" >/dev/null
          # Login to ECR
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_URI"
          # Pull GHCR images and push to ECR
          docker pull "${{ steps.select-backend-tag.outputs.image }}"
          docker tag  "${{ steps.select-backend-tag.outputs.image }}" "$ECR_URI/$PROJECT_NAME-backend:${{ github.sha }}"
          docker tag  "${{ steps.select-backend-tag.outputs.image }}" "$ECR_URI/$PROJECT_NAME-backend:latest"
          docker push "$ECR_URI/$PROJECT_NAME-backend:${{ github.sha }}"
          docker push "$ECR_URI/$PROJECT_NAME-backend:latest"
          docker pull "${{ steps.select-frontend-tag.outputs.image }}"
          docker tag  "${{ steps.select-frontend-tag.outputs.image }}" "$ECR_URI/$PROJECT_NAME-frontend:${{ github.sha }}"
          docker tag  "${{ steps.select-frontend-tag.outputs.image }}" "$ECR_URI/$PROJECT_NAME-frontend:latest"
          docker push "$ECR_URI/$PROJECT_NAME-frontend:${{ github.sha }}"
          docker push "$ECR_URI/$PROJECT_NAME-frontend:latest"
          echo "backend_ecr_image=$ECR_URI/$PROJECT_NAME-backend:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "frontend_ecr_image=$ECR_URI/$PROJECT_NAME-frontend:${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Make import generator executable
        run: chmod +x ./terraform/generate-imports-tf.sh

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ github.ref == 'refs/heads/main' && 'prod/terraform.tfstate' || 'dev/terraform.tfstate' }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Generate Terraform import blocks (imports.auto.tf)
        working-directory: terraform
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          ./generate-imports-tf.sh ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -var-file="environments/${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}/terraform.tfvars" -out=tfplan
        env:
          TF_VAR_backend_image_uri: ${{ needs.build-and-push.outputs.ecr-backend-image-uri }}
          TF_VAR_frontend_image_uri: ${{ needs.build-and-push.outputs.ecr-frontend-image-uri }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Terraform Apply
        if: github.event_name == 'push'
        working-directory: terraform
        run: terraform apply -auto-approve "tfplan"

      - name: Get ALB DNS
        id: alb
        run: |
          echo "dns=$(aws elbv2 describe-load-balancers --query 'LoadBalancers[0].DNSName' --output text)" >> $GITHUB_OUTPUT

      - name: Smoke tests
        run: |
          echo "Testing ALB endpoint: ${{ steps.alb.outputs.dns }}"
          # Wait for service to be ready
          for i in {1..30}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ steps.alb.outputs.dns }}/ping || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Backend health check passed"
              break
            fi
            echo "Attempt $i/30: HTTP $HTTP_CODE, retrying in 10s..."
            sleep 10
          done

          # Test frontend
          curl -s http://${{ steps.alb.outputs.dns }}/ | grep -q "<!DOCTYPE html" && echo "✓ Frontend serving correctly" || echo "✗ Frontend check failed"

      - name: Rollback - Targeted destroy of newly-created resources on failure
        if: failure() && github.event_name == 'push'
        working-directory: terraform
        run: |
          echo "Deployment failed. Performing targeted rollback..."
          # Produce JSON plan for analysis
          terraform show -json tfplan > tfplan.json || true
          # Collect addresses created/replaced (exclude critical resources)
          ADDRS=$(jq -r '
            .resource_changes[] | select(.change.actions | index("create") or index("replace")) |
            .address | select(
              test("module.rds|module.redis|module.alb|module.vpc") | not
            )' tfplan.json | xargs)
          if [ -n "$ADDRS" ]; then
            echo "Destroying targets: $ADDRS"
            terraform destroy -auto-approve \
              -var-file="environments/${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}/terraform.tfvars" \
              $(printf ' -target=%s' $ADDRS)
          else
            echo "No safe targets to destroy. Skipping."
          fi
          echo "✓ Targeted rollback complete."
        env:
          TF_VAR_backend_image_uri: ${{ needs.build-and-push.outputs.ecr-backend-image-uri }}
          TF_VAR_frontend_image_uri: ${{ needs.build-and-push.outputs.ecr-frontend-image-uri }}

  notify:
    if: always()
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack (if configured)
        if: success()
        run: |
          echo "✓ Deployment successful!"
          # Add Slack webhook integration here if needed
