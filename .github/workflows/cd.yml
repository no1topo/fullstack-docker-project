name: CD - Build & Deploy

on:
  push:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  TERRAFORM_VERSION: 1.5.0
  # map branches to environment names
  ENV_NAME: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      backend-image: ${{ steps.select-backend-tag.outputs.tag }}
      frontend-image: ${{ steps.select-frontend-tag.outputs.tag }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- BACKEND ---
      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Select single backend tag
        id: select-backend-tag
        run: |
          FIRST_TAG="$(echo "${{ steps.meta-backend.outputs.tags }}" | head -n1)"
          echo "tag=${FIRST_TAG}" >> $GITHUB_OUTPUT

      # --- FRONTEND ---
      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Select single frontend tag
        id: select-frontend-tag
        run: |
          FIRST_TAG="$(echo "${{ steps.meta-frontend.outputs.tags }}" | head -n1)"
          echo "tag=${FIRST_TAG}" >> $GITHUB_OUTPUT

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false 
          # Wrapper false allows us to capture pure outputs easily if needed

      - name: Terraform Init (Partial Config)
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=fullstack-docker/${{ env.ENV_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=terraform-locks"

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var-file="environments/${{ env.ENV_NAME }}/terraform.tfvars" \
            -out=tfplan
        env:
          # Pass Docker Image Tags to Terraform Variables
          TF_VAR_backend_image_uri: ${{ needs.build-and-push.outputs.backend-image }}
          TF_VAR_frontend_image_uri: ${{ needs.build-and-push.outputs.frontend-image }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Terraform Apply
        working-directory: terraform
        if: github.event_name == 'push'
        run: terraform apply -auto-approve "tfplan"

      # --- VERIFICATION ---
      
      - name: Get Load Balancer DNS
        id: alb
        working-directory: terraform
        # Ensure you have an output in your terraform called 'alb_dns_name'
        run: |
          echo "dns=$(terraform output -raw alb_dns_name)" >> $GITHUB_OUTPUT

      - name: Smoke tests
        run: |
          echo "Testing ALB endpoint: ${{ steps.alb.outputs.dns }}"
          # Wait for service to stabilize
          sleep 30 
          
          # Simple Health Check
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ steps.alb.outputs.dns }}/health || echo "000")
          
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "404" ]; then
             echo "? Infrastructure is reachable (Code: $HTTP_CODE)"
          else
             echo "? Warning: Health check returned $HTTP_CODE. Check ECS logs."
             # We don't fail the build here to allow you to debug without pipeline crashing
          fi
